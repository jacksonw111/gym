name: Deploy EMAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-emas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare EMAS configuration
        env:
          EMAS_MINIPROGRAM_CONFIG: ${{ secrets.EMAS_MINIPROGRAM_CONFIG }}
          EMAS_SERVER_SECRETS: ${{ secrets.EMAS_SERVER_SECRETS }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          node -e "const fs=require('node:fs'); const mini=JSON.parse(process.env.EMAS_MINIPROGRAM_CONFIG); const server=JSON.parse(process.env.EMAS_SERVER_SECRETS); server.wechatAppSecret=process.env.WECHAT_APP_SECRET; fs.writeFileSync('miniprogram/config/emas.local.js', 'module.exports = ' + JSON.stringify(mini, null, 2) + '\n'); fs.writeFileSync('emas/secrets.local.json', JSON.stringify(server, null, 2) + '\n')"

      - name: Check code
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Sync database collections and indexes
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: npm run emas:db-sync

      - name: Deploy core EMAS services
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: npm run emas:deploy -- gym-api gym-admin-api auto-complete-lessons

      - name: Probe deployed admin function
        env:
          EMAS_SERVER_SECRETS: ${{ secrets.EMAS_SERVER_SECRETS }}
        run: |
          ORIGIN=$(node -e "console.log(JSON.parse(process.env.EMAS_SERVER_SECRETS).adminAllowedOrigin)")
          curl -sS -X POST "https://fc-mp-823fb75d-0fd0-4255-89fd-9d4a5303cc38.next.bspapp.com/http/gym-admin-api" \
            -H "origin: $ORIGIN" -H "content-type: application/json" \
            -d '{"action":"__ci_probe__","requestId":"ci-probe","payload":{}}' || true
          echo
          sleep 30

      - name: Show recent function logs
        if: always()
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: node scripts/show-function-logs.mjs gym-admin-api gym-api
